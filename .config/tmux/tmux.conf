# ==================================
#  General Options
# ==================================
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Enable some vim usage
setw -g mode-keys vi

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Forward terminal focus changes to applications such as Neovim
set -g focus-events on

# Advertise tmux's own terminfo entry; client capabilities come from terminfo.
set -g default-terminal "tmux-256color"

# Use tmux/OSC 52 as the clipboard bridge. This keeps the desktop clipboard
# authoritative while allowing copies from local, nested, and SSH sessions.
set -s set-clipboard on

# Keep substantial scrollback without allowing every pane to retain 1M lines
set -g history-limit 100000

# Use zsh as the default interactive shell
set -g default-shell /usr/bin/zsh

# ==================================
#  Keybindings
# ==================================
# Resize panes with prefix hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Split windows with | and -
unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

# Refresh config with leader r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Copy-paste behavior
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"

# Graphics
set -g status-right-length 100
set -g status-left-length 100

# ==================================
#  Plugins (TPM)
# ==================================
# Set plugin path to the new directory
set -g @tpm_plugins_path '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank' # Copy to the clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'o0th/tmux-nova'

# --- Plugin Configurations ---
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Keep copy mode open after yanking and write through tmux's OSC 52 bridge.
# Unlike wl-copy, this also works when tmux is running on a remote SSH host.
set -g @yank_action 'copy-pipe'
set -g @override_copy_command 'tmux load-buffer -w -'

# --- Auto-Save Settings ---
# set -g @continuum-boot 'on'
set -g @continuum-restore 'on'        # Restore last saved environment (automatically)
set -g @continuum-save-interval '15'  # Save every 15 minutes (default)
# Note: Continuum saves automatically on a timer, not immediately on exit.

# --- Nova Theme ---
set -g @nova-nerdfonts true
set -g @nova-pane-border-style "#282a36"
set -g @nova-pane-active-border-style "#1a73e8" 
set -g @nova-status-style-bg "#4c566a"
set -g @nova-status-style-fg "#d8dee9"
set -g @nova-status-style-active-bg "#89c0d0"
set -g @nova-status-style-active-fg "#2e3540"
set -g @nova-status-style-double-bg "#2d3540"
set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"
set -g @nova-segment-session "#S"
set -g @nova-segment-session-colors "#78a2c1 #2e3440"
set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "#78a2c1 #2e3440"
set -g @nova-rows 0
set -g @nova-segments-0-left "session"
set -g @nova-segments-0-right "whoami"

# Continuum must load after themes so Nova cannot overwrite its status-right
# autosave trigger.
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run ~/.config/tmux/plugins/tpm/tpm
